name: test-notification

# Workflow temporaire, declenchement manuel seulement. Il verifie que la
# notification de La Frontiere arrive bien par courriel, sans lancer le
# pipeline ni depenser le moindre appel au modele.
#
# Il existe parce qu'une issue creee a la main depuis le poste d'Ulrich ne
# notifie rien : GitHub ne signale pas a quelqu'un ses propres actions. Dans
# le vrai workflow, c'est github-actions[bot] qui ouvre l'issue, donc un
# autre acteur, et la notification part. Ce workflow reproduit exactement ce
# cas. A supprimer une fois la verification faite.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rendre la notification sur les deux dernieres entrees publiees
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pipeline import rendre_notification_publication as notif

          flux = json.loads(Path("frontiere/data/flux.json").read_text(encoding="utf-8"))
          recents = sorted(flux, key=lambda e: e.get("date_publication", ""), reverse=True)[:2]
          notif.CURES.write_text(
              json.dumps([{"id": e["id"]} for e in recents]), encoding="utf-8"
          )
          notif.main()
          PY

      - name: Notifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[test] $(cat pipeline/_publication_du_jour_titre.txt)" \
            --body-file pipeline/_publication_du_jour.md \
            --assignee ulrich-e-r-djidonou
