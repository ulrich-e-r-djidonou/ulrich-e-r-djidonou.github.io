name: frontiere

on:
  schedule:
    - cron: "0 11 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Executer le pipeline
        env:
          FRONTIERE_LLM: api
          LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          LLM_API_MODELE: gemini-3.6-flash
          LLM_API_CLE: ${{ secrets.LLM_API_CLE }}
          # Le palier gratuit accorde 20 requetes par jour et par modele. Le
          # budget etait a 16 (4 articles garantis) pour garder de la marge
          # avant le mur ; porte a 20 le 5 aout 2026 pour garantir 5 articles
          # par execution, ce que le repli ci-dessous rend sans risque : la
          # marge n'est plus dans le budget, elle est dans le second
          # fournisseur. Un article coute 2 appels quand ses deux champs sont
          # valides du premier coup, 4 au pire (2 champs x 2 essais), donc ce
          # budget rend 5 articles au pire et jusqu'a 9 au mieux. Les items
          # non rediges ne sont pas marques vus et reviennent a l'execution
          # suivante, le jeudi ou le lundi.
          LLM_BUDGET_APPELS: "20"
          # Repli si Gemini est en panne ou si son quota gratuit est epuise
          # (429, cas du 3 aout 2026) : curate.py bascule alors sur Claude
          # pour le reste de l'execution plutot que de faire echouer le job.
          # LLM_BUDGET_APPELS ci-dessus reste compte une seule fois, tous
          # fournisseurs confondus (voir pipeline/curate.py, _appel_ollama).
          LLM_API_URL_REPLI: https://api.anthropic.com/v1/chat/completions
          LLM_API_MODELE_REPLI: claude-haiku-4-5
          LLM_API_CLE_REPLI: ${{ secrets.LLM_API_CLE_REPLI }}
        run: |
          python pipeline/collect.py
          python pipeline/curate.py
          python pipeline/publish.py

      - name: Verifier le balisage schema.org
        # Avant le commit, contrairement a la sante du flux : un JSON-LD casse
        # est une regression reelle (contenu invisible ou mal attribue pour
        # un lecteur automatise), pas juste un signal a surveiller.
        run: python -m pipeline.verifier_jsonld

      - name: Verifier qu'aucune source n'a perdu tous ses auteurs
        # Meme logique : une source dont 100% des items sont sans auteur
        # signale une extraction cassee (voir pipeline/verifier_auteurs.py),
        # pas un simple manque isole a documenter apres coup.
        run: python -m pipeline.verifier_auteurs

      - name: Committer si changements
        run: |
          git config user.name "frontiere-bot"
          git config user.email "actions@github.com"
          git add frontiere/ pipeline/seen.json sitemap.xml
          git diff --cached --quiet || git commit -m "frontiere: mise a jour automatique $(date -u +%F)"
          git push

      - name: Rapporter les sources qui n'alimentent plus la veille
        # Informatif, jamais bloquant : une source calme une semaine donnee
        # n'est pas une panne. verifier_sante.py couvre deja le flux dans son
        # ensemble ; ce rapport-ci descend au niveau de chaque source, la ou
        # une mort silencieuse passe autrement inapercue. Un flux qui repond
        # 200 avec un XML valide et zero entree recente ne leve aucune erreur
        # nulle part ailleurs.
        if: always()
        run: python -m pipeline.verifier_fraicheur_sources

      - name: Verifier la sante du flux
        # Placee apres le commit : une alerte ne doit jamais empecher la
        # maintenance normale (archives, fenetre de 90 jours) d'etre publiee.
        # Echoue le job si les 2 dernieres executions ont publie zero item,
        # ce qui declenche la notification GitHub par defaut sur les
        # executions planifiees en echec.
        run: python pipeline/verifier_sante.py
