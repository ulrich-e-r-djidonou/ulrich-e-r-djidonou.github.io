name: frontiere

on:
  schedule:
    # Lundi, jeudi et samedi. Le samedi est ajoute le 19 aout 2026 pour
    # compenser le debit perdu par la redaction anglaise, qui double le cout
    # d'un article. Le quota gratuit se renouvelle par jour : un jour de plus
    # est un budget complet de plus, la ou relever LLM_BUDGET_APPELS ferait
    # payer le fournisseur de repli. Revenir a "0 11 * * 1,4" suffit a annuler.
    - cron: "0 11 * * 1,4,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Executer le pipeline
        env:
          FRONTIERE_LLM: api
          LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          LLM_API_MODELE: gemini-3.6-flash
          LLM_API_CLE: ${{ secrets.LLM_API_CLE }}
          # Le chiffre de 20 requetes par jour et par modele vient du palier
          # gratuit tel qu'il etait documente a la mise en place. Verifie le
          # 19 aout 2026 : Google ne publie plus de chiffres et renvoie chacun
          # a la page Rate limits de son propre projet dans AI Studio. Le
          # budget ci-dessous n'est donc plus cale sur une limite connue.
          # A verifier dans AI Studio avant de le relever. Le
          # budget etait a 16 (4 articles garantis) pour garder de la marge
          # avant le mur ; porte a 20 le 5 aout 2026 pour garantir 5 articles
          # par execution, ce que le repli ci-dessous rend sans risque : la
          # marge n'est plus dans le budget, elle est dans le second
          # fournisseur.
          #
          # Le cout par article a double le 19 aout 2026 avec la redaction des
          # champs anglais (FRONTIERE_RESUME_EN, actif par defaut) : 4 champs
          # au lieu de 2, donc 4 appels quand tout passe du premier coup et 8
          # au pire. A budget constant, ce sont 2 articles garantis et jusqu'a
          # 5 au mieux, contre 5 et 9 avant l'anglais. Les items non rediges ne
          # sont pas marques vus et reviennent a l'execution suivante, le jeudi
          # ou le lundi : le flux se remplit plus lentement, il ne se perd pas.
          # Relever ce budget deborderait les 20 requetes gratuites et ferait
          # payer le repli : decision d'Ulrich, pas un reglage a faire seul.
          LLM_BUDGET_APPELS: "20"
          # Repli si Gemini est en panne ou si son quota gratuit est epuise
          # (429, cas du 3 aout 2026) : curate.py bascule alors sur Claude
          # pour le reste de l'execution plutot que de faire echouer le job.
          # LLM_BUDGET_APPELS ci-dessus reste compte une seule fois, tous
          # fournisseurs confondus (voir pipeline/curate.py, _appel_ollama).
          LLM_API_URL_REPLI: https://api.anthropic.com/v1/chat/completions
          LLM_API_MODELE_REPLI: claude-haiku-4-5
          LLM_API_CLE_REPLI: ${{ secrets.LLM_API_CLE_REPLI }}
        run: |
          python pipeline/collect.py
          python pipeline/curate.py
          python pipeline/publish.py

      - name: Verifier le balisage schema.org
        # Avant le commit, contrairement a la sante du flux : un JSON-LD casse
        # est une regression reelle (contenu invisible ou mal attribue pour
        # un lecteur automatise), pas juste un signal a surveiller.
        run: python -m pipeline.verifier_jsonld

      - name: Verifier qu'aucune source n'a perdu tous ses auteurs
        # Meme logique : une source dont 100% des items sont sans auteur
        # signale une extraction cassee (voir pipeline/verifier_auteurs.py),
        # pas un simple manque isole a documenter apres coup.
        run: python -m pipeline.verifier_auteurs

      - name: Verifier que la page anglaise ne retombe pas sur le francais
        # Apres le commit, comme la sante du flux : un item sans champs
        # anglais reste publiable, le francais lui sert de repli. Ce qui
        # doit alerter, c'est la derive generale, pas l'item isole. Le
        # rattrapage est manuel (voir pipeline/verifier_bilinguisme_flux.py)
        # parce qu'il consomme du budget LLM hors du lot du jour.
        continue-on-error: true
        run: python -m pipeline.verifier_bilinguisme_flux

      - name: Committer si changements
        run: |
          git config user.name "frontiere-bot"
          git config user.email "actions@github.com"
          # en/frontier/index.html recoit son propre JSON-LD depuis publish.py
          # (PAGES_FLUX couvre les deux langues). L'oublier ici laissait le
          # fichier modifie hors de l'index : le rebase ci-dessous refusait
          # alors de tourner ("cannot pull with rebase: You have unstaged
          # changes") et le job echouait apres avoir depense le budget LLM.
          git add frontiere/ en/frontier/index.html pipeline/seen.json sitemap.xml
          git diff --cached --quiet || git commit -m "frontiere: mise a jour automatique $(date -u +%F)"
          # Un fichier ecrit par le pipeline mais absent du "git add" ci-dessus
          # ferait echouer le rebase avec un message qui ne nomme pas le
          # coupable. Le nommer ici : le prochain oubli se lit dans le journal
          # au lieu de se deduire.
          if ! git diff --quiet; then
            echo "::error::Fichiers modifies hors du git add ci-dessus :"
            git diff --name-only
            exit 1
          fi
          # etat-projets.yml et regenerer-flux.yml commitent sur la meme
          # branche : se rebaser evite un refus de poussee si les crons se
          # croisent, apres que le budget LLM a deja ete consomme. Apres le
          # commit, jamais avant : l'index ne doit pas etre en attente pendant
          # le rebase. Sans rien a committer, le pull est sans effet.
          git pull --rebase --quiet origin main
          git push

      - name: Rapporter les sources qui n'alimentent plus la veille
        # Informatif, jamais bloquant : une source calme une semaine donnee
        # n'est pas une panne. verifier_sante.py couvre deja le flux dans son
        # ensemble ; ce rapport-ci descend au niveau de chaque source, la ou
        # une mort silencieuse passe autrement inapercue. Un flux qui repond
        # 200 avec un XML valide et zero entree recente ne leve aucune erreur
        # nulle part ailleurs.
        if: always()
        run: python -m pipeline.verifier_fraicheur_sources

      - name: Verifier la sante du flux
        # Placee apres le commit : une alerte ne doit jamais empecher la
        # maintenance normale (archives, fenetre de 90 jours) d'etre publiee.
        # Echoue le job si les 2 dernieres executions ont publie zero item,
        # ce qui declenche la notification GitHub par defaut sur les
        # executions planifiees en echec.
        run: python pipeline/verifier_sante.py
