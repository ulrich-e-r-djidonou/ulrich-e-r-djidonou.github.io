name: tests

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Executer les tests
        run: |
          python -m unittest \
            pipeline.test_curate \
            pipeline.test_publish \
            pipeline.benchmark.test_benchmark \
            --verbose

      - name: Verifier que les validateurs restent calibres
        # Le seuil d'arret de 20 % hors formule est la condition posee avant
        # l'activation de la validation. Si une modification des validateurs le
        # depasse, le run echoue plutot que de faire chuter le volume du flux.
        run: python -m pipeline.calibrer_validateurs frontiere/data/flux.json
