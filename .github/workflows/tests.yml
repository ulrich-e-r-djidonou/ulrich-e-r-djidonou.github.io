name: tests

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Executer les tests
        run: |
          python -m unittest \
            pipeline.test_curate \
            pipeline.test_publish \
            pipeline.test_collect \
            pipeline.test_verifier_sante \
            pipeline.test_verifier_jsonld \
            pipeline.test_verifier_automatisation \
            pipeline.test_verifier_workflows \
            pipeline.test_etat_projets \
            pipeline.benchmark.test_benchmark \
            --verbose

      - name: Mesurer le taux de rejet sur le flux publie
        # Informatif seulement. Le flux contient encore des textes rediges
        # avant les validateurs actuels : leur taux de rejet mesure l'age du
        # contenu, pas la calibration. La protection contre un validateur trop
        # severe est dans les tests, qui verifient qu'aucune phrase francaise
        # correcte n'est rejetee.
        run: python -m pipeline.calibrer_validateurs frontiere/data/flux.json --rapport-seul
