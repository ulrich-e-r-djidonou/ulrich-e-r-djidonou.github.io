name: regenerer-flux

on:
  # Le rattrapage des 25 textes herites de l'ancien modele local est termine
  # (4 aout 2026 : 18 items Gemini, 7 items Claude). Le declenchement planifie
  # est retire pour ne plus consommer le quota Gemini partage avec la veille ;
  # ce workflow reste disponible manuellement si un lot doit etre reecrit.
  workflow_dispatch:
    inputs:
      appliquer_seulement:
        description: "Appliquer la relecture deja produite, sans rien rediger"
        type: boolean
        default: false
      rattrapage_anglais:
        # Second usage, ajoute le 19 aout 2026 avec la version anglaise du
        # site. Les items publies avant que curate.py sache rediger l'anglais
        # n'ont ni resume_en ni angle_eco_en, et /en/frontier/ leur sert du
        # francais. Ce mode ajoute les champs manquants sans toucher au
        # francais publie. Le budget d'appels vaut pour les deux modes, donc
        # il faut plusieurs executions pour vider le lot.
        description: "Completer les champs anglais des items publies, au lieu de reecrire le francais"
        type: boolean
        default: false
      budget_appels:
        # Plafond d'appels au modele pour cette execution, tous fournisseurs
        # confondus. La valeur par defaut est calee sur le palier gratuit de
        # Gemini (20 requetes par jour et par modele), avec de la marge : c'est
        # le bon reglage tant que le lot avance a cout nul, un jour a la fois.
        # La relever fait deborder sur le repli, qui est facture. Un rattrapage
        # qu'on veut terminer le jour meme le justifie : 4 appels par item au
        # pire, environ 0,004 $ US l'item sur claude-haiku-4-5. Au-dela de ce
        # cas, laisser la valeur par defaut.
        description: "Plafond d'appels au modele (16 = quota gratuit, plus = facture au repli)"
        type: string
        default: "16"

permissions:
  contents: write
  issues: write

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Restaurer la relecture produite par l'execution precedente
        # Chaque cle est unique (suffixe run_id) pour pouvoir en creer une
        # nouvelle a chaque sauvegarde : le cache GitHub est immuable pour une
        # cle donnee. restore-keys retombe sur la derniere sauvegardee, ce qui
        # fait office de --reprendre d'une execution a l'autre. Les deux modes
        # ont leur prefixe : un lot anglais qui reprendrait un releve francais
        # croirait avoir deja traite des items qu'il n'a jamais vus.
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/_regeneration.json
            pipeline/_regeneration.md
            pipeline/_rattrapage_en.json
            pipeline/_rattrapage_en.md
          key: ${{ inputs.rattrapage_anglais && 'rattrapage-en' || 'regeneration-legacy' }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.rattrapage_anglais && 'rattrapage-en' || 'regeneration-legacy' }}-

      - name: Rediger le lot du jour, dans la limite du quota
        if: ${{ !inputs.appliquer_seulement && !inputs.rattrapage_anglais }}
        env:
          FRONTIERE_LLM: api
          LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          LLM_API_MODELE: gemini-3.6-flash
          LLM_API_CLE: ${{ secrets.LLM_API_CLE }}
          # Meme budget que la veille, pour la meme raison : s'arreter avant le
          # mur. Un quota atteint se paie deux fois, en requetes refusees puis
          # en tentatives de reprise qui consomment le quota du lendemain.
          LLM_BUDGET_APPELS: ${{ inputs.budget_appels }}
          # Meme repli que la veille : regenerer_flux.py passe par
          # curate._appel_ollama, donc la bascule vers Claude en cas de panne
          # ou de quota Gemini epuise s'applique ici sans code supplementaire.
          LLM_API_URL_REPLI: https://api.anthropic.com/v1/chat/completions
          LLM_API_MODELE_REPLI: claude-haiku-4-5
          LLM_API_CLE_REPLI: ${{ secrets.LLM_API_CLE_REPLI }}
        run: python -m pipeline.regenerer_flux --reprendre

      - name: Completer les champs anglais du lot du jour
        # Meme budget et meme repli que le mode francais : c'est le meme quota
        # Gemini, partage avec la veille. Un item anglais coute au plus quatre
        # appels, donc quatre items par execution.
        if: ${{ !inputs.appliquer_seulement && inputs.rattrapage_anglais }}
        env:
          FRONTIERE_LLM: api
          LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          LLM_API_MODELE: gemini-3.6-flash
          LLM_API_CLE: ${{ secrets.LLM_API_CLE }}
          LLM_BUDGET_APPELS: ${{ inputs.budget_appels }}
          LLM_API_URL_REPLI: https://api.anthropic.com/v1/chat/completions
          LLM_API_MODELE_REPLI: claude-haiku-4-5
          LLM_API_CLE_REPLI: ${{ secrets.LLM_API_CLE_REPLI }}
        run: python -m pipeline.regenerer_flux --anglais --reprendre

      - name: Publier la relecture dans le resume de l'execution
        # !cancelled() plutot que la condition seule : sans fonction de statut,
        # GitHub ajoute un success() implicite et sauterait cette etape des que
        # la redaction s'interrompt, c'est-a-dire quand elle est le plus utile.
        if: ${{ !cancelled() && !inputs.appliquer_seulement }}
        run: |
          if [ "${{ inputs.rattrapage_anglais }}" = "true" ]; then
            cat pipeline/_rattrapage_en.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat pipeline/_regeneration.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sauvegarder la relecture pour l'execution suivante
        # Meme raison : un lot interrompu par un quota ou une saturation doit
        # laisser derriere lui ce qu'il a deja redige, sinon --reprendre ne
        # reprend jamais rien.
        if: ${{ !cancelled() && !inputs.appliquer_seulement }}
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/_regeneration.json
            pipeline/_regeneration.md
            pipeline/_rattrapage_en.json
            pipeline/_rattrapage_en.md
          key: ${{ inputs.rattrapage_anglais && 'rattrapage-en' || 'regeneration-legacy' }}-${{ github.run_id }}

      - name: Appliquer les textes valides
        # --depuis-relecture ne rappelle jamais le modele : le texte publie est
        # exactement celui qui vient d'etre redige et valide. L'etape est sure
        # a repeter : ecrire_flux laisse intact tout item dont le texte courant
        # ne correspond plus a celui de la relecture, donc les items appliques
        # les jours precedents ne sont pas reecrits. Cote anglais, la meme
        # garde tient : un item deja bilingue n'est jamais reecrit.
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ inputs.rattrapage_anglais }}" = "true" ]; then
            python -m pipeline.regenerer_flux --anglais --depuis-relecture
          else
            python -m pipeline.regenerer_flux --depuis-relecture
          fi

      - name: Committer si le flux a change
        if: ${{ !cancelled() }}
        run: |
          git config user.name "frontiere-bot"
          git config user.email "actions@github.com"
          # Le script reinjecte aussi le JSON-LD des pages du flux a partir du
          # flux reecrit : sans les committer ici, la page indexee divergerait
          # du flux jusqu'a la prochaine execution de publish.py. Les deux
          # langues sont concernees, regenerer_flux boucle sur PAGES_FLUX.
          git add frontiere/data/flux.json frontiere/index.html \
            en/frontier/index.html
          if git diff --cached --quiet; then
            echo "Rien a publier aujourd'hui : tous les items sont deja reecrits."
            exit 0
          fi
          if [ "${{ inputs.rattrapage_anglais }}" = "true" ]; then
            git commit -m "frontiere: champs anglais des textes publies, lot du $(date -u +%F)"
          else
            git commit -m "frontiere: reecriture des textes publies, lot du $(date -u +%F)"
          fi
          # La veille commite sur la meme branche les lundis et jeudis : se
          # rebaser evite un refus de poussee si les deux se croisent.
          git pull --rebase origin main
          git push

      - name: Notifier ce qui vient d'etre publie
        # La relecture avant publication a disparu avec le declenchement
        # automatique : ceci la remplace par une relecture a posteriori.
        # L'assignation, pas l'ouverture seule, est ce qui declenche une
        # notification GitHub fiable independamment des reglages de suivi
        # du depot.
        if: ${{ !cancelled() && !inputs.rattrapage_anglais && hashFiles('pipeline/_regeneration_du_jour.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "La Frontiere : textes reecrits le $(date -u +%F)" \
            --body-file pipeline/_regeneration_du_jour.md \
            --assignee ulrich-e-r-djidonou

      - name: Notifier les champs anglais ajoutes
        # Le mode anglais n'a pas de rapport du jour distinct : il n'ajoute que
        # des champs absents, donc tout ce qu'il produit est nouveau et le
        # releve complet suffit.
        if: ${{ !cancelled() && inputs.rattrapage_anglais && hashFiles('pipeline/_rattrapage_en.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "La Frontiere : champs anglais ajoutes le $(date -u +%F)" \
            --body-file pipeline/_rattrapage_en.md \
            --assignee ulrich-e-r-djidonou
