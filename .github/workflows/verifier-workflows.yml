name: verifier-workflows

# Une automatisation en panne ne se plaint pas : GitHub envoie un courriel
# par execution ratee, qui se noie dans les autres. Trois projets ont ainsi
# passe des mois a ne plus se mettre a jour. Ce controle hebdomadaire fait
# echouer le run des qu'une automatisation planifiee est cassee, desactivee
# ou muette : une seule notification, sur un depot qu'on regarde.

on:
  schedule:
    - cron: "0 12 * * 1"
  push:
    branches: [main]
    paths:
      - "pipeline/verifier_workflows.py"
      - ".github/workflows/verifier-workflows.yml"
  workflow_dispatch: {}

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Verifier la sante des automatisations
        # JETON_SANTE_DEPOTS doit etre un jeton a portee fine, en LECTURE
        # SEULE, avec les permissions « Metadata: Read » et « Actions: Read »
        # et rien d'autre. Un jeton classique ne sait pas lire un depot prive
        # sans la portee `repo`, qui donne aussi l'ECRITURE sur tous les
        # depots prives du compte : la stocker dans un depot public mettrait
        # ce pouvoir a une modification de workflow pres.
        #
        # Sans ce secret, le controle retombe sur les depots publics et le
        # dit dans son rapport plutot que d'annoncer une couverture qu'il n'a
        # pas. Les noms des depots prives restent masques : le journal d'un
        # depot public est lisible par tout le monde.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JETON_DEPOTS: ${{ secrets.JETON_SANTE_DEPOTS }}
        run: python -m pipeline.verifier_workflows
