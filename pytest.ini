[pytest]
# Sur certaines installations Windows (Python via Microsoft Store, execute
# depuis Git Bash), le plugin de capture fd/sys de pytest plante a la
# fermeture de session (`ValueError: I/O operation on closed file` dans
# _pytest/capture.py, avant meme que les tests ne s'executent). C'est un
# probleme d'environnement (stdio non standard sous MSYS/mintty), pas un bug
# du code teste. `--capture=no` evite le plantage sans rien desactiver
# d'autre : les tests de ce depot n'utilisent pas capsys/capfd/caplog.
# La CI (.github/workflows/tests.yml) utilise unittest, pas pytest, et n'est
# donc pas concernee par ce reglage.
addopts = --capture=no
